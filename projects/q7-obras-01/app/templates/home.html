{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🏗️</div>
      <h1 class="text-3xl font-bold text-gray-800">Q7 Obras</h1>
      <p class="text-gray-500 mt-2 text-lg">Controlá los gastos de tu obra sin complicaciones</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
      <form method="post" action="/obras" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre de la obra *</label>
          <input type="text" name="nombre" required
                 placeholder="Ej: Reforma Casa Playa"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
          <textarea name="descripcion" rows="2"
                    placeholder="Detalles opcionales..."
                    class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Presupuesto total</label>
          <input type="number" name="presupuesto_total" step="1" min="0"
                 placeholder="15000000"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha inicio</label>
            <input type="date" name="fecha_inicio"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha fin prevista</label>
            <input type="date" name="fecha_fin_prevista"
                   class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-lg transition shadow-md hover:shadow-lg">
          🚀 Crear obra
        </button>
      </form>
    </div>

    <p class="text-center text-gray-400 text-sm mt-6">
      Sin registro. Sin app. Solo tu link.
    </p>
  </div>
</div>
{% endblock %}
