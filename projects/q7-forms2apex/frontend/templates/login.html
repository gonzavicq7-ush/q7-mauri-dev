{% extends "base.html" %}

{% block title %}Login — q7-forms2apex{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8" x-data="loginForm()">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">q7-forms2apex</h1>
            <p class="text-slate-500 mt-1">Inicia sesión para continuar</p>
        </div>

        <form @submit.prevent="submit()" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input
                    type="email"
                    x-model="email"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500"
                    placeholder="usuario@empresa.com"
                >
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input
                    type="password"
                    x-model="password"
                    required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500"
                    placeholder="••••••••"
                >
            </div>
            <button
                type="submit"
                :disabled="loading"
                class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 rounded-lg transition disabled:opacity-50"
            >
                <span x-show="!loading">Iniciar sesión</span>
                <span x-show="loading" class="flex items-center justify-center">
                    <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24" fill="none">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    Entrando...
                </span>
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            ¿No tienes cuenta? <a href="/auth/register" class="text-slate-800 font-medium hover:underline">Regístrate</a>
        </p>
    </div>
</div>

<script>
function loginForm() {
    return {
        email: '',
        password: '',
        loading: false,
        async submit() {
            this.loading = true;
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email, password: this.password }),
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    alert(data.detail || 'Error de autenticación');
                }
            } catch (e) {
                alert('Error de red: ' + e.message);
            } finally {
                this.loading = false;
            }
        }
    };
}
</script>
{% endblock %}
